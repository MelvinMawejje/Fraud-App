name: fraud_watch
description: A fraud detection app
environment:
  sdk: ">=3.0.0 <4.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/models/model_francis.tflite
    - assets/models/tokenizer_config.json
    - assets/models/vocab.txt
    - .env

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  permission_handler: ^12.0.0
  record: ^6.0.0
  tflite_flutter: ^0.11.0
  speech_to_text: ^7.0.0
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  flutter_dotenv: ^5.2.1 # For API key security
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
